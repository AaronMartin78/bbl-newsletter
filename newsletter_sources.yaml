# BBL Newsletter - source registry
# version: 1 (2026-10-12)
# Companion note: bbl_newsletter_source_verification_2026-10-12.md
# status values:
#   ready         - verified accessible and permitted as observed
#   conditional   - accessible but with restrictions (see reason)
#   pending_check - not verifiable from the 2026-10-12 toolchain; check at first run from LAN
#   disabled      - do not collect (see reason)
# All robots/TDM findings are point-in-time. The collector re-checks robots.txt at runtime.

version: 1

defaults:
  user_agent: "bbl-newsletter-collector/0.1 (private, non-commercial; +https://aaron-martin-phd.dev)"
  obey_robots: true
  conditional_get: true
  request_timeout_s: 15
  max_articles_per_source_per_run: 20

sources:
  # ---- League / European ----
  - id: bbl_newscenter
    publisher: easyCredit BBL (official)
    type: league
    url: https://easycredit-bbl.de/newscenter
    method: html_listing            # server-rendered Next.js, observed 2026-10-12
    article_host: cms.easycredit-bbl.de
    article_url_pattern: 'https://cms\.easycredit-bbl\.de/de/n/news/'
    feed: none
    robots: >
      https://cms.easycredit-bbl.de/robots.txt returns 404 (nginx/1.22.1),
      checked from HUB by owner 2026-10-17: no robots policy, crawling not
      restricted; the fetcher's runtime robots check stays on regardless
    status: ready
  - id: euroleague_news
    publisher: Euroleague Basketball (official)
    type: league
    language: en
    url: https://www.euroleaguebasketball.net/en/euroleague/news/
    method: unknown
    robots: site unreachable from toolchain 2026-10-12 (two attempts)
    status: pending_check
  - id: eurohoops_bbl
    publisher: Eurohoops
    type: aggregator
    language: en
    feed: https://www.eurohoops.net/en/bbl/feed/
    method: rss
    status: ready
    reason: census 2026-10-04 verified feed; low volume, big-club bias


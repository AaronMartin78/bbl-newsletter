  # ---- Regional press: public broadcasters (ARD) ----
  - id: hessenschau
    publisher: hessenschau (hr/ARD)
    type: regional_public
    covers: [frankfurt]
    feed: https://www.hessenschau.de/sport/index.rss
    method: rss
    robots: generic crawlers allowed on content paths; AI-training UAs blocked (observed 2026-10-12)
    status: conditional
    reason: >
      TDM reservation in robots.txt with an exception for RAG/grounding when
      directives are followed and content is attributed; contact justiziariat@hr.de
      for permissions. Feed returned items dated 2026-09-10 on a 2026-10-12 fetch;
      verify freshness at build time.
  - id: br24
    publisher: BR24 (BR/ARD)
    type: regional_public
    covers: [bayern, bamberg, wuerzburg]
    url: https://www.br.de
    method: sitemap
    sitemap: https://www.br.de/nachrichten/sitemaps/index.xml
    robots: generic crawlers allowed on news content; AI-training UAs blocked (owner-supplied robots.txt, 2026-10-12)
    status: conditional
    reason: >
      ARD TDM reservation (Stand 19.05.2026): prohibits use for AI training/model
      development; explicit exception for RAG/grounding when robots directives are
      followed and content is attributed to its source. Contact nutzungsvorbehalt@br.de.
  - id: mdr
    publisher: MDR (ARD)
    type: regional_public
    covers: [jena, chemnitz, mbc]
    url: https://www.mdr.de
    method: sitemap
    sitemap: https://www.mdr.de/sitemap/mdr-news-ueberblick-102~news.xml
    # /video-* pages are thin multi-sport roundups; one put an RB Leipzig
    # women's football paragraph inside a Niners story (problem 3, 2026-10-14)
    exclude_url_pattern: '/video-'
    robots: >
      generic crawlers allowed on news content (disallows cover internal paths,
      mediathek portal, *.json, player pages); site-mirroring tools (HTTrack etc.)
      and AI-training UAs blocked (owner-supplied robots.txt, 2026-10-12)
    status: conditional
    reason: >
      Same ARD TDM reservation (Stand 19.05.2026) as br24/hessenschau: prohibits
      AI training/model development use; explicit exception for RAG/grounding with
      robots compliance and source attribution. Contact: postal/phone only in the
      file (MDR, Kantstr. 71-73, 04275 Leipzig), no email given.

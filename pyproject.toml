[project]
name = "bbl-newsletter"
version = "0.1.0"
description = "Daily English BBL newsletter pipeline: collect -> cluster -> summarize -> render"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2",
    "PyYAML>=6",
    "feedparser>=6",
    "httpx>=0.27",
    "trafilatura>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbl_newsletter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
